version: "3"

vars:
  APP_MODULE: celine.community.main:app
  HOST: 0.0.0.0
  PORT: 8019

tasks:
  setup:
    desc: Install development dependencies
    cmds:
      - uv sync

  run:
    desc: Run the Community BFF with hot reload
    cmds:
      # Use the prepared virtualenv directly. `uv run` reconciles the lockfile
      # before starting and would replace celine-dev's editable celine-sdk link,
      # making the local NudgingAdminClient disappear at every restart.
      - .venv/bin/uvicorn {{.APP_MODULE}} --host {{.HOST}} --port {{.PORT}} --reload

  debug:
    desc: Run the Community BFF with debugpy
    cmds:
      - .venv/bin/python -m debugpy --listen 0.0.0.0:4{{.PORT}} -m uvicorn {{.APP_MODULE}} --host {{.HOST}} --port {{.PORT}} --reload

  test:
    desc: Run tests
    cmds:
      - .venv/bin/pytest

  lint:
    desc: Run lint and formatting checks
    cmds:
      - .venv/bin/ruff check .
      - .venv/bin/ruff format --check .

  openapi:
    desc: Export the stable OpenAPI contract to stdout
    cmds:
      - .venv/bin/python scripts/export_openapi.py

  alembic:upgrade:
    desc: Run pending migrations
    cmds:
      - .venv/bin/alembic upgrade head

  alembic:create:
    desc: Create an autogenerated migration
    cmds:
      - .venv/bin/alembic revision --autogenerate -m "{{.CLI_ARGS}}"
    vars:
      CLI_ARGS: '{{default "auto generated migration" .CLI_ARGS}}'

  release:
    desc: Create a semantic release
    cmds:
      - .venv/bin/semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
