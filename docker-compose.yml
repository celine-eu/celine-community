services:
  db-create:
    image: postgres:17-alpine
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-securepassword123}
    command: >-
      sh -c "psql -h host.docker.internal -p 15432 -U postgres -tc
      \"SELECT 1 FROM pg_database WHERE datname='celine_community'\" | grep -q 1
      || createdb -h host.docker.internal -p 15432 -U postgres celine_community"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    depends_on:
      db-create:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # No development default: unset is hardened (celine.sdk.posture). Set
      # CELINE_ENV=dev in the shell or in .env to run with the local defaults.
      CELINE_ENV: ${CELINE_ENV:-}
      ENVIRONMENT: ${ENVIRONMENT:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      DEV_USER_PROFILE: ${DEV_USER_PROFILE:-manager}
      WEBAPP_API_URL: ${WEBAPP_API_URL:-http://host.docker.internal:8014}
      ROI_API_URL: ${ROI_API_URL:-http://host.docker.internal:8018}
    ports:
      - "8019:8019"
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"
