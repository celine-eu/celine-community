[project]
name = "celine-community"
version = "0.1.0"
description = "Backend-for-frontend for the CELINE REC Manager Dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.31.0",
  "celine-sdk>=1.17.3",
  "fastapi>=0.136.1",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "psycopg2-binary>=2.9.12",
  "sqlalchemy>=2.0.0",
  "sqlalchemy-utils>=0.42.1",
  "uvicorn[standard]>=0.46.0",
  "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
  "debugpy>=1.8.20",
  "httpx>=0.28.1",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "python-semantic-release>=10.5.3",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/community"]
sources = {"src" = ""}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock && uv build"
branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"
upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true
